services:
  - type: web
    name: senatemovement
    runtime: python
    plan: free
    region: frankfurt
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python3 deploy.py
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: SENATE_MOVEMENT_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
